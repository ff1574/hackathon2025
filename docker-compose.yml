version: "3.8"

services:
  frontend:
    build: ./hackathon-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

  backend:
    build: ./hackathon-express
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./hackathon-express:/app
      - /app/node_modules

volumes:
  node_modules:
